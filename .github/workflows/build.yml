name: Build VPK
on:
  push:
  workflow_dispatch:
jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: vdpm libvita2d vitaShaRK SceShaccCgExt taihen freetype libpng libjpeg-turbo zlib || true
      - name: Build
        run: |
          # compiler errors also become annotations (readable through the API without the log)
          if ! { cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4; } > build.log 2>&1; then
            grep -E "error|Error|undefined reference" build.log | head -25 | sed 's/^/::error::/'
            tail -n 15 build.log | sed 's/^/::error::tail: /'
            exit 1
          fi
          tail -n 3 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: VegPlayer
          path: build/VegPlayer.vpk

  # the bare .vpk as a release download (no zip around it), refreshed on every push to main
  release:
    needs: vpk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VegPlayer
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest VegPlayer.vpk --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}."
